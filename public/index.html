  <body>
    <main class="site-shell">
      <header class="site-header">
        <a class="brand" href="/" aria-label="Eye O Ewe home">
          <img class="brand-mark" src="/app-icon.webp" alt="" width="44" height="44" />
          <span>Eye&nbsp;O&nbsp;Ewe</span>
        </a>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark theme" hidden>
          <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" /></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4" /><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" /></g></svg>
        </button>
      </header>

      <section class="home-hero" aria-labelledby="hero-title">
        <h1 id="hero-title" class="home-title">Split bills with friends, privately.</h1>
        <p class="tagline">Your expenses are encrypted, so only your group can see them. Most apps can see everything you add.</p>
      </section>

      <section class="free" aria-labelledby="free-title">
        <h2 id="free-title">Free and ad-free</h2>
        <p>There’s no limit on how many expenses you can add.</p>
      </section>

      <p class="store-badge">
        <a href="https://play.google.com/apps/internaltest/4701549140080017667"><img src="/google-play-badge.png" alt="Get it on Google Play" width="646" height="250" /></a>
      </p>

      <section class="screens" aria-label="The app">
        <img class="shot-img shot-light" loading="lazy" src="/group-light.webp" width="816" height="1813" alt="A group’s balances in Eye O Ewe" />
        <img class="shot-img shot-dark" loading="lazy" src="/group-dark.webp" width="816" height="1813" alt="A group’s balances in Eye O Ewe" />
        <img class="shot-img shot-light" loading="lazy" src="/expense-light.webp" width="816" height="1813" alt="Adding an expense in Eye O Ewe" />
        <img class="shot-img shot-dark" loading="lazy" src="/expense-dark.webp" width="816" height="1813" alt="Adding an expense in Eye O Ewe" />
      </section>

      <section class="touch" aria-labelledby="touch-title">
        <h2 id="touch-title">Get in touch</h2>
        <p>Questions or ideas? Email <a href="mailto:hello@eyeoewe.app">hello@eyeoewe.app</a></p>
      </section>
    </main>
